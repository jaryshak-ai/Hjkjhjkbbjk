          cat > Auction/src/main/java/auction/AuctionMenu.java << 'EOF_7'
          package auction;

          import auction.economy.Economy;
          import cn.nukkit.Player;
          import cn.nukkit.event.player.PlayerFormRespondedEvent;
          import cn.nukkit.form.element.Element;
          import cn.nukkit.form.element.ElementInput;
          import cn.nukkit.form.response.FormResponseCustom;
          import cn.nukkit.form.window.FormWindowCustom;
          import cn.nukkit.inventory.Inventory;
          import cn.nukkit.inventory.InventoryType;
          import cn.nukkit.item.Item;
          import cn.nukkit.item.enchantment.Enchantment;

          import java.lang.reflect.Constructor;
          import java.lang.reflect.Method;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.UUID;

          /** Меню рынка: двойной сундук на встроенном FakeInventory Nukkit-MOT. */
          public class AuctionMenu {
              public enum Mode { ALL, MINE, CONFIRM }

              private static final String TITLE = "§l§6Рынок";

              // Раскладка: рамка из барьеров, лоты внутри (4 ряда x 7 колонок)
              private static final int[] AREA = new int[28];

              static {
                  int k = 0;
                  for (int r = 1; r <= 4; r++) {
                      for (int c = 1; c <= 7; c++) {
                          AREA[k++] = r * 9 + c;
                      }
                  }
              }

              private static final int SLOT_STATS = 4;
              private static final int SLOT_PREV = 46;
              private static final int SLOT_SEARCH = 47;
              private static final int SLOT_RESET = 48;
              private static final int SLOT_PAGE = 49;
              private static final int SLOT_MODE = 50;
              private static final int SLOT_NEXT = 52;
              private static final int SLOT_LOT = 22;
              private static final int SLOT_YES = 20;
              private static final int SLOT_NO = 24;

              private static class Session {
                  final Player player;
                  final Inventory inv;
                  Mode mode = Mode.ALL;
                  String search = "";
                  int page = 0;
                  long selected = 0;
                  long confirmId = 0;
                  boolean opened = false;
                  final Map<Integer, Long> shown = new HashMap<>();

                  Session(Player player, Inventory inv) {
                      this.player = player;
                      this.inv = inv;
                  }
              }

              private static class PendingSearch {
                  final int formId;
                  final Mode mode;
                  final String search;

                  PendingSearch(int formId, Mode mode, String search) {
                      this.formId = formId;
                      this.mode = mode;
                      this.search = search;
                  }
              }

              private final AuctionPlugin plugin;
              private final Map<UUID, Session> sessions = new HashMap<>();
              private final Map<UUID, PendingSearch> forms = new HashMap<>();
              private boolean fakeErrorLogged = false;

              public AuctionMenu(AuctionPlugin plugin) {
                  this.plugin = plugin;
              }

              // ================= жизненный цикл =================

              public boolean isMarket(Inventory inv) {
                  for (Session s : sessions.values()) {
                      if (s.inv == inv) {
                          return true;
                      }
                  }
                  return false;
              }

              public void closed(Player p, Inventory inv) {
                  Session s = sessions.get(p.getUniqueId());
                  if (s != null && s.inv == inv) {
                      sessions.remove(p.getUniqueId());
                  }
              }

              public void quit(Player p) {
                  sessions.remove(p.getUniqueId());
                  forms.remove(p.getUniqueId());
              }

              public void closeAll() {
                  for (Session s : new ArrayList<>(sessions.values())) {
                      close(s.player);
                  }
              }

              private void close(Player p) {
                  Session s = sessions.remove(p.getUniqueId());
                  if (s != null) {
                      try {
                          p.removeWindow(s.inv);
                      } catch (Throwable ignored) {
                          // окно уже закрыто
                      }
                  }
              }

              public void open(Player p, Mode mode, String search) {
                  close(p);
                  Inventory inv = createInventory();
                  if (inv == null) {
                      p.sendMessage("§cНе удалось создать меню рынка (смотри консоль сервера)");
                      return;
                  }
                  final UUID id = p.getUniqueId();
                  final Session s = new Session(p, inv);
                  s.mode = mode == Mode.CONFIRM ? Mode.ALL : mode;
                  s.search = search == null ? "" : search;
                  sessions.put(id, s);
                  render(s);
                  plugin.getServer().getScheduler().scheduleDelayedTask(plugin, () -> {
                      if (!p.isOnline() || sessions.get(id) != s) {
                          return;
                      }
                      try {
                          if (p.addWindow(inv) == -1) {
                              sessions.remove(id);
                              p.sendMessage("§cНе удалось открыть рынок (addWindow вернул -1)");
                          } else {
                              s.opened = true;
                          }
                      } catch (Throwable t) {
                          sessions.remove(id);
                          plugin.getLogger().error("[Auction] ошибка, этап: открытие окна", t);
                          p.sendMessage("§cОшибка рынка (открытие окна): " + t);
                      }
                  }, 3);
              }

              /** Создаёт FakeInventory (двойной сундук) через рефлексию, чтобы подойти к разным сборкам MOT. */
              private Inventory createInventory() {
                  String[] classes = {
                          "cn.nukkit.inventory.fake.FakeInventory",
                          "cn.nukkit.inventory.FakeInventory",
                          "cn.nukkit.inventory.fake.DoubleChestFakeInventory"
                  };
                  Throwable last = null;
                  for (String cn : classes) {
                      Class<?> c;
                      try {
                          c = Class.forName(cn);
                      } catch (Throwable t) {
                          last = t;
                          continue;
                      }
                      try {
                          Object o = null;
                          for (Constructor<?> k : c.getConstructors()) {
                              Class<?>[] pt = k.getParameterTypes();
                              if (pt.length == 2 && pt[0] == InventoryType.class && pt[1] == String.class) {
                                  o = k.newInstance(InventoryType.DOUBLE_CHEST, TITLE);
                                  break;
                              }
                          }
                          if (o == null) {
                              for (Constructor<?> k : c.getConstructors()) {
                                  Class<?>[] pt = k.getParameterTypes();
                                  if (pt.length == 1 && pt[0] == InventoryType.class) {
                                      o = k.newInstance(InventoryType.DOUBLE_CHEST);
                                      trySetTitle(c, o);
                                      break;
                                  }
                                  if (pt.length == 1 && pt[0] == String.class) {
                                      o = k.newInstance(TITLE);
                                      break;
                                  }
                                  if (pt.length == 0) {
                                      o = k.newInstance();
                                      trySetTitle(c, o);
                                      break;
                                  }
                              }
                          }
                          if (o instanceof Inventory) {
                              return (Inventory) o;
                          }
                      } catch (Throwable t) {
                          last = t;
                      }
                  }
                  if (!fakeErrorLogged) {
                      fakeErrorLogged = true;
                      plugin.getLogger().error("[Auction] не найден/не создаётся FakeInventory в этой сборке Nukkit-MOT", last);
                  }
                  return null;
              }

              private void trySetTitle(Class<?> c, Object o) {
                  try {
                      Method m = c.getMethod("setTitle", String.class);
                      m.invoke(o, TITLE);
                  } catch (Throwable ignored) {
                      // заголовка нет, не страшно
                  }
              }

              public void refreshAll() {
                  for (Session s : new ArrayList<>(sessions.values())) {
                      if (s.mode == Mode.CONFIRM && plugin.findLot(s.confirmId) == null) {
                          s.mode = Mode.ALL;
                      }
                      render(s);
                  }
              }

              // ================= рисование =================

              private static Item barrier() {
                  Item it = null;
                  try {
                      it = Item.fromString("minecraft:barrier");
                  } catch (Throwable ignored) {
                      // нет такого предмета в этой сборке
                  }
                  if (it == null || it.getId() == 0) {
                      it = Item.get(160, 15); // чёрная стеклянная панель
                  }
                  it.setCustomName("§r ");
                  return it;
              }

              private static Item named(Item it, String name, String... lore) {
                  it.setCustomName(name);
                  if (lore.length > 0) {
                      it.setLore(lore);
                  }
                  return it;
              }

              private static String plain(String s) {
                  return s == null ? "" : s.replaceAll("§.", "");
              }

              private void render(Session s) {
                  Inventory inv = s.inv;
                  s.shown.clear();
                  Item bar = barrier();
                  for (int i = 0; i < 54; i++) {
                      inv.setItem(i, bar.clone(), false);
                  }
                  if (s.mode == Mode.CONFIRM) {
                      renderConfirm(s);
                  } else {
                      renderList(s);
                  }
                  if (s.opened) {
                      inv.sendContents(s.player);
                  }
              }

              private List<Lot> filtered(Session s) {
                  String uid = s.player.getUniqueId().toString();
                  String q = s.search == null ? "" : s.search.toLowerCase().trim();
                  List<Lot> out = new ArrayList<>();
                  for (Lot l : plugin.lots) {
                      if (s.mode == Mode.MINE && !uid.equals(l.seller)) {
                          continue;
                      }
                      if (!q.isEmpty() && !plain(l.toItem().getName()).toLowerCase().contains(q)) {
                          continue;
                      }
                      out.add(l);
                  }
                  out.sort((a, b) -> Long.compare(b.created, a.created));
                  return out;
              }

              private void renderList(Session s) {
                  Inventory inv = s.inv;
                  List<Lot> list = filtered(s);
                  int per = AREA.length;
                  int pages = Math.max(1, (list.size() + per - 1) / per);
                  if (s.page >= pages) {
                      s.page = pages - 1;
                  }
                  if (s.page < 0) {
                      s.page = 0;
                  }
                  int from = s.page * per;
                  for (int i = 0; i < per && from + i < list.size(); i++) {
                      Lot l = list.get(from + i);
                      int slot = AREA[i];
                      inv.setItem(slot, display(l, s), false);
                      s.shown.put(slot, l.id);
                  }
                  if (list.isEmpty()) {
                      inv.setItem(SLOT_LOT, named(Item.get(339), "§7Ничего не найдено"), false);
                  }

                  inv.setItem(SLOT_STATS, statsItem(s), false);
                  if (s.page > 0) {
                      inv.setItem(SLOT_PREV, named(Item.get(262), "§e◀ Назад"), false);
                  }
                  inv.setItem(SLOT_SEARCH, named(Item.get(345), "§bПоиск по названию", "§7Нажми и введи название предмета"), false);
                  if (!s.search.isEmpty()) {
                      inv.setItem(SLOT_RESET, named(Item.get(152), "§cСбросить поиск"), false);
                  }
                  Item pageItem = named(Item.get(339), "§fСтраница §e" + (s.page + 1) + "§f из §e" + pages);
                  if (!s.search.isEmpty()) {
                      pageItem.setLore("§7Сейчас ищем: §f" + s.search);
                  }
                  inv.setItem(SLOT_PAGE, pageItem, false);
                  if (s.mode == Mode.MINE) {
                      inv.setItem(SLOT_MODE, named(Item.get(339), "§eВсе лоты", "§7Нажми, чтобы вернуться на рынок"), false);
                  } else {
                      inv.setItem(SLOT_MODE, named(Item.get(54), "§aМои лоты", "§7Нажми, чтобы посмотреть, что выставил ты"), false);
                  }
                  if (s.page < pages - 1) {
                      inv.setItem(SLOT_NEXT, named(Item.get(262), "§eВперёд ▶"), false);
                  }
              }

              private void renderConfirm(Session s) {
                  Inventory inv = s.inv;
                  Lot lot = plugin.findLot(s.confirmId);
                  if (lot == null) {
                      s.mode = Mode.ALL;
                      renderList(s);
                      return;
                  }
                  Item it = lot.toItem();
                  List<String> lore = new ArrayList<>(Arrays.asList(loreOf(it)));
                  lore.add("§r§7Цена: §e" + lot.price + " монет");
                  lore.add("§r§7Продавец: §f" + lot.sellerName);
                  it.setLore(lore.toArray(new String[0]));
                  inv.setItem(SLOT_STATS, named(Item.get(339), "§e§lПодтвердите покупку"), false);
                  inv.setItem(SLOT_LOT, it, false);
                  inv.setItem(SLOT_YES, named(Item.get(35, 5), "§a§l✔ Купить", "§7За §e" + lot.price + " §7монет"), false);
                  inv.setItem(SLOT_NO, named(Item.get(35, 14), "§c§l✖ Отмена"), false);
              }

              private static String[] loreOf(Item it) {
                  String[] l = it.getLore();
                  return l == null ? new String[0] : l;
              }

              private Item display(Lot lot, Session s) {
                  Item it = lot.toItem();
                  List<String> lore = new ArrayList<>(Arrays.asList(loreOf(it)));
                  lore.add("§r§7Цена: §e" + lot.price + " монет");
                  lore.add("§r§7Продавец: §f" + lot.sellerName);
                  boolean own = s.player.getUniqueId().toString().equals(lot.seller);
                  lore.add(own ? "§r§aВаш лот §7(клик дважды: снять)" : "§r§8Клик: информация, второй клик: купить");
                  it.setLore(lore.toArray(new String[0]));
                  return it;
              }

              private Item statsItem(Session s) {
                  String uid = s.player.getUniqueId().toString();
                  long bal = 0;
                  try {
                      bal = plugin.economy.getBalance(s.player.getName());
                  } catch (Exception ignored) {
                      // баланс покажем нулём
                  }
                  long soldSum = plugin.sold.getOrDefault(uid, 0L);
                  return named(Item.get(340), "§6§lСтатистика",
                          "§7Продано на сумму: §e" + soldSum,
                          "§7Твоих лотов: §e" + plugin.countLots(s.player.getUniqueId()) + "§7/§e" + plugin.maxLots,
                          "§7Всего лотов на рынке: §e" + plugin.lots.size(),
                          "§7Твой баланс: §e" + bal);
              }

              // ================= клики =================

              public void click(Player p, int slot) {
                  Session s = sessions.get(p.getUniqueId());
                  if (s == null || !p.isOnline()) {
                      return;
                  }
                  try {
                      if (s.mode == Mode.CONFIRM) {
                          clickConfirm(s, slot);
                          return;
                      }
                      Long id = s.shown.get(slot);
                      if (id != null) {
                          clickLot(s, id);
                          return;
                      }
                      s.selected = 0;
                      switch (slot) {
                          case SLOT_PREV:
                              if (s.page > 0) {
                                  s.page--;
                                  render(s);
                              }
                              break;
                          case SLOT_NEXT:
                              s.page++;
                              render(s);
                              break;
                          case SLOT_SEARCH:
                              openSearch(s);
                              break;
                          case SLOT_RESET:
                              if (!s.search.isEmpty()) {
                                  s.search = "";
                                  s.page = 0;
                                  render(s);
                              }
                              break;
                          case SLOT_MODE:
                              s.mode = s.mode == Mode.MINE ? Mode.ALL : Mode.MINE;
                              s.page = 0;
                              render(s);
                              break;
                          case SLOT_STATS:
                              render(s);
                              break;
                          default:
                              break;
                      }
                  } catch (Throwable t) {
                      plugin.getLogger().error("[Auction] ошибка, этап: клик", t);
                      p.sendMessage("§cОшибка рынка (клик): " + t);
                  }
              }

              private void clickLot(Session s, long id) {
                  Player p = s.player;
                  Lot lot = plugin.findLot(id);
                  if (lot == null) {
                      p.sendMessage("§cЛот уже продан или снят");
                      s.selected = 0;
                      render(s);
                      return;
                  }
                  boolean own = p.getUniqueId().toString().equals(lot.seller);
                  if (s.selected != id) {
                      s.selected = id;
                      sendInfo(p, lot, own);
                      return;
                  }
                  s.selected = 0;
                  if (own) {
                      withdrawOwn(s, lot);
                  } else if (lot.price > plugin.confirmAbove) {
                      s.mode = Mode.CONFIRM;
                      s.confirmId = id;
                      render(s);
                  } else {
                      purchase(s, id);
                  }
              }

              private void clickConfirm(Session s, int slot) {
                  if (slot == SLOT_YES) {
                      long id = s.confirmId;
                      s.mode = Mode.ALL;
                      purchase(s, id);
                  } else if (slot == SLOT_NO) {
                      s.mode = Mode.ALL;
                      s.confirmId = 0;
                      s.player.sendMessage("§7Покупка отменена");
                      render(s);
                  }
              }

              private void sendInfo(Player p, Lot lot, boolean own) {
                  Item it = lot.toItem();
                  String name = it.getName() + (it.getCount() > 1 ? " §7x" + it.getCount() : "");
                  p.sendMessage("§6Предмет: §f" + name);
                  Enchantment[] en = it.getEnchantments();
                  if (en != null && en.length > 0) {
                      p.sendMessage("§6Чары: §f" + Enchants.format(en));
                  }
                  p.sendMessage("§6Цена: §e" + lot.price + " §7| Продавец: §f" + lot.sellerName);
                  p.sendMessage(own ? "§aНажми ещё раз, чтобы снять лот с продажи" : "§aНажми ещё раз, чтобы купить");
              }

              private void noSpace(Session s) {
                  s.player.sendMessage("§cУ вас нет места в инвентаре!");
                  close(s.player);
              }

              private void withdrawOwn(Session s, Lot lot) {
                  Player p = s.player;
                  Item item = lot.toItem();
                  if (!p.getInventory().canAddItem(item)) {
                      noSpace(s);
                      return;
                  }
                  plugin.lots.remove(lot);
                  p.getInventory().addItem(item);
                  plugin.saveData();
                  p.sendMessage("§aЛот снят с продажи, предмет возвращён");
                  plugin.refreshAll();
              }

              private void purchase(Session s, long id) {
                  Player p = s.player;
                  String uid = p.getUniqueId().toString();
                  Lot lot = plugin.findLot(id);
                  s.confirmId = 0;
                  if (lot == null) {
                      p.sendMessage("§cЛот уже продан или снят");
                      render(s);
                      return;
                  }
                  if (uid.equals(lot.seller)) {
                      render(s);
                      return;
                  }
                  Economy eco = plugin.economy;
                  try {
                      eco.ensureAccount(p);
                      String buyer = p.getName();
                      long price = lot.price;
                      long bal = eco.getBalance(buyer);
                      if (bal < price) {
                          p.sendMessage("§cНедостаточно монет! Нужно §e" + price + "§c, у вас §e" + bal);
                          render(s);
                          return;
                      }
                      Item item = lot.toItem();
                      if (!p.getInventory().canAddItem(item)) {
                          noSpace(s);
                          return;
                      }
                      long fee = price * plugin.commission / 100L;
                      long payout = price - fee;
                      if (payout > 0 && !eco.canReceive(lot.sellerName, payout)) {
                          p.sendMessage("§cПродавец сейчас не может получить оплату (нет аккаунта или переполнен баланс)");
                          render(s);
                          return;
                      }
                      if (!eco.take(buyer, price)) {
                          p.sendMessage("§cНе удалось снять монеты");
                          render(s);
                          return;
                      }
                      if (payout > 0 && !eco.add(lot.sellerName, payout)) {
                          eco.add(buyer, price);
                          p.sendMessage("§cОшибка оплаты, монеты возвращены");
                          render(s);
                          return;
                      }
                      plugin.lots.remove(lot);
                      plugin.sold.merge(lot.seller, price, Long::sum);
                      p.getInventory().addItem(item);
                      plugin.saveData();

                      String nm = item.getName() + (item.getCount() > 1 ? " §7x" + item.getCount() : "");
                      p.sendMessage("§aВы купили §f" + nm + " §aза §e" + price + "§a. Баланс: §e" + eco.getBalance(buyer));
                      try {
                          Player sp = plugin.getServer().getOnlinePlayers().get(UUID.fromString(lot.seller));
                          if (sp != null && sp.isOnline()) {
                              sp.sendMessage("§aВаш лот §f" + nm + " §aкуплен игроком §f" + buyer
                                      + "§a. Получено: §e" + payout + " §7(комиссия " + fee + ")");
                          }
                      } catch (Exception ignored) {
                          // продавец не в сети
                      }
                  } catch (Exception e) {
                      plugin.getLogger().error("[Auction] ошибка, этап: оплата", e);
                      p.sendMessage("§cОшибка рынка (оплата): " + e);
                  }
                  plugin.refreshAll();
              }

              // ================= поиск (форма) =================

              private void openSearch(Session s) {
                  final Player p = s.player;
                  final UUID id = p.getUniqueId();
                  final Mode back = s.mode == Mode.CONFIRM ? Mode.ALL : s.mode;
                  final String cur = s.search;
                  close(p);
                  plugin.getServer().getScheduler().scheduleDelayedTask(plugin, () -> {
                      if (!p.isOnline()) {
                          return;
                      }
                      List<Element> el = new ArrayList<>();
                      el.add(new ElementInput("Название предмета", "например: diamond sword"));
                      int fid = p.showFormWindow(new FormWindowCustom("§lПоиск на рынке", el));
                      forms.put(id, new PendingSearch(fid, back, cur));
                  }, 8);
              }

              public void handleForm(PlayerFormRespondedEvent e) {
                  Player p = e.getPlayer();
                  PendingSearch ps = forms.get(p.getUniqueId());
                  if (ps == null || ps.formId != e.getFormID()) {
                      return;
                  }
                  forms.remove(p.getUniqueId());
                  String q = ps.search;
                  if (!e.wasClosed() && e.getResponse() instanceof FormResponseCustom) {
                      String in = ((FormResponseCustom) e.getResponse()).getInputResponse(0);
                      q = in == null ? "" : in.trim();
                  }
                  open(p, ps.mode, q);
              }
          }
